# 推送 v* 标签时在 Apple Silicon runner 上打包 .app，压缩后发布到 Releases
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本标签（如 v1.0），留空则只打包不发布"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ "$TAG" == v* ]]; then export VERSION="${TAG#v}"; else export VERSION="0.0-dev"; fi
          ./build.sh

      - name: Zip
        run: ditto -c -k --sequesterRsrc --keepParent "Qwen 生图.app" QwenImage-macOS-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QwenImage-macOS-arm64
          path: QwenImage-macOS-arm64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # 手动触发时标签还不存在，gh 会在当前提交上创建
          gh release create "$TAG" QwenImage-macOS-arm64.zip \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes
